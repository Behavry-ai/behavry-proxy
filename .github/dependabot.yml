# Security alerts work without this file; scheduled version updates do not.
# Added because every action in .github/workflows is pinned to a commit SHA
# (#13), and a pin with no update mechanism rots in place - it trades the risk
# of a moved tag for the risk of a frozen, known-vulnerable version. This is
# the other half of that change.
version: 2

updates:
  # The SHAs pinned in #13. Dependabot rewrites both the digest and the
  # trailing `# vX.Y.Z` comment, which is why that comment is worth keeping.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # One PR for routine bumps; majors stay separate, since for actions a
      # major is usually a runtime change (the Node 20 -> 24 migration) rather
      # than a version number.
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # Dockerfile and docker-compose.yaml.
  #
  # CAVEAT: a bump to `openpolicyagent/opa` in docker-compose.yaml is always
  # incomplete on its own. ci.yml carries OPA_VERSION *and* OPA_SHA256 for the
  # same release, and Dependabot will not touch those - so such a PR must not
  # be merged without updating both by hand, or CI will fetch one version and
  # verify it against another version's digest.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
