name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the release workflow run exactly these gates, rather than keeping a
  # second copy that can drift.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel only pull-request runs, where a new push makes the previous run
  # moot and nothing has read its result yet.
  #
  # Every other trigger produces a status something else trusts, so cancelling
  # it destroys information rather than saving time:
  #   - push to main  leaves the default branch's own commit with a cancelled
  #                   check, which is indistinguishable at a glance from a
  #                   branch that was never tested.
  #   - tag push      is gating a release to PyPI.
  #   - workflow_call is the `gate` job in release.yml, reached either by a tag
  #                   or by a manual dry run from main.
  #
  # Testing the event rather than the ref is what covers that last case: a
  # dispatched release gate runs with github.ref still on refs/heads/main, so a
  # ref-based check reads it as cancellable. It also fails in the safe
  # direction - anything this expression cannot classify is simply not
  # cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with the OPA image pinned in docker-compose.yaml. The bundled
  # policies are Rego v1 and do not parse on OPA 0.x.
  OPA_VERSION: "1.20.0"
  # sha256 of opa_linux_amd64_static for the version above, from the upstream
  # release's own .sha256 asset. Update both together, never just the version —
  # an unverified download of a pinned version is still an unverified download.
  OPA_SHA256: "4e4c65be08ed27e7375d816d446a444e65ba101806014c7a51b2a7652c2a942a"

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound is pyproject's `python = "^3.11"`.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Use an in-project virtualenv
        run: poetry config virtualenvs.in-project true

      - name: Cache virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      # Fails if pyproject.toml was edited without re-running `poetry lock`,
      # so CI and Docker cannot silently resolve different dependency sets.
      - name: Verify poetry.lock matches pyproject.toml
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --with dev

      - name: Lint
        run: poetry run ruff check .

      # pyproject, __init__.py and server.json all declare the version; a
      # release that disagrees between them fails MCP registry validation.
      - name: Check version consistency
        run: poetry run python scripts/check_version.py

      - name: Test
        run: poetry run pytest

  policies:
    name: policies (OPA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OPA
        run: |
          curl -fsSL -o "$RUNNER_TEMP/opa" \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          # Verify before chmod +x: this binary evaluates the policies that
          # decide allow/deny, so a swapped release asset must fail the build
          # rather than silently run.
          echo "${OPA_SHA256}  $RUNNER_TEMP/opa" | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/opa"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Show OPA version
        run: opa version

      # Catches Rego v0 syntax and rules that conflict with one another —
      # either one leaves OPA with no usable decision, which denies everything.
      - name: Check policies
        run: opa check --strict behavry_proxy/bundled/policies

      - name: Test policies
        run: opa test behavry_proxy/bundled/policies tests/policies -v

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      # Needed by verify_wheel.py, which parses the policies as installed in
      # site-packages — something the `policies` job cannot do, since it only
      # ever sees the checkout.
      - name: Install OPA
        run: |
          curl -fsSL -o "$RUNNER_TEMP/opa" \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  $RUNNER_TEMP/opa" | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/opa"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build
        run: poetry build

      - name: Validate distribution metadata
        run: |
          pipx install twine
          twine check dist/*

      # The package has to work from a clean install, not just from the repo.
      - name: Verify the wheel installs and runs standalone
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install --quiet dist/*.whl
          "$RUNNER_TEMP/clean/bin/behavry-proxy" --version
          "$RUNNER_TEMP/clean/bin/behavry-proxy" --help > /dev/null
          # Run from outside the checkout so the source tree cannot shadow
          # the installed package.
          mkdir -p "$RUNNER_TEMP/elsewhere"
          cd "$RUNNER_TEMP/elsewhere"
          "$RUNNER_TEMP/clean/bin/python" \
            "$GITHUB_WORKSPACE/scripts/verify_wheel.py" --require-opa

      - name: Upload distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
