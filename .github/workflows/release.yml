name: Release

# Publishes to PyPI with Trusted Publishing (OIDC). There is no API token:
# PyPI verifies a short-lived identity token describing this repository, this
# workflow file and this environment, so nothing long-lived is stored anywhere.
#
# One-time setup on PyPI, before the first release:
#   https://pypi.org/manage/account/publishing/
#   Owner: Behavry-ai   Repository: behavry-proxy
#   Workflow: release.yml   Environment: pypi
# The package does not exist yet, so this is a "pending publisher"; PyPI
# creates the project on the first successful upload. TestPyPI needs the same
# entry with environment "testpypi".
#
# Releasing:
#   Dry run   — Actions > Release > Run workflow > target: testpypi
#   Real      — bump the version in all four places, then:
#                 git tag v0.1.0 && git push origin v0.1.0
#
# A version can never be re-uploaded to PyPI, so the dry run is worth doing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  # The full CI gate — tests on every supported Python, policy checks and the
  # standalone wheel check. Reused rather than duplicated so it cannot drift.
  gate:
    uses: ./.github/workflows/ci.yml

  build:
    name: build
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      # A tag that disagrees with the declared version would publish metadata
      # under the wrong number, and that cannot be undone on PyPI.
      - name: Check the tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_version.py --expect-tag "${{ github.ref_name }}"

      - name: Check version consistency
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: python scripts/check_version.py

      - name: Build
        run: poetry build

      - name: Validate distribution metadata
        run: |
          pipx install twine
          twine check --strict dist/*

      # Guards the marker the MCP registry reads to verify PyPI ownership. If
      # it is missing from the rendered description, the registry cannot
      # confirm the package is ours.
      - name: Confirm the MCP registry marker survived into metadata
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as zf:
              name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              metadata = zf.read(name).decode()
          marker = "<!-- mcp-name: ai.behavry/proxy -->"
          assert marker in metadata, f"{marker} missing from {name}"
          print(f"marker present in {name}")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/behavry-proxy
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/behavry-proxy
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
