[tool.poetry]
name = "behavry-proxy"
version = "0.1.0"
description = "Open-source MCP governance proxy — DLP, policy enforcement, and injection scanning for AI agents"
authors = ["Behavry <oss@behavry.ai>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/Behavry-ai/behavry-proxy"
repository = "https://github.com/Behavry-ai/behavry-proxy"
keywords = ["mcp", "ai-agents", "governance", "dlp", "policy", "proxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
packages = [{include = "behavry_proxy"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.32.0"}
httpx = ">=0.27.0"
pydantic = ">=2.0"
pydantic-settings = ">=2.0"
pyyaml = ">=6.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.24"
ruff = ">=0.8"

[tool.poetry.group.tui.dependencies]
textual = ">=1.0"

[tool.poetry.group.metrics.dependencies]
prometheus-client = ">=0.21"

[tool.poetry.scripts]
behavry-proxy = "behavry_proxy.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
