[project]
name = "behavry-proxy"
version = "0.1.0"
description = "Open-source MCP governance proxy — DLP, policy enforcement, and injection scanning for AI agents"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "Apache-2.0"
authors = [{ name = "Behavry", email = "oss@behavry.ai" }]
keywords = ["mcp", "ai-agents", "governance", "dlp", "policy", "proxy"]
# Defining classifiers here disables Poetry's automatic enrichment, so the
# Python versions below must be maintained by hand alongside requires-python.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.27.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/Behavry-ai/behavry-proxy"
Repository = "https://github.com/Behavry-ai/behavry-proxy"

[project.scripts]
behavry-proxy = "behavry_proxy.cli:main"

# Build configuration stays under [tool.poetry]; PEP 621 has no equivalent.
[tool.poetry]
packages = [{ include = "behavry_proxy" }]
include = [
    { path = "behavry_proxy/bundled/**/*.rego", format = ["sdist", "wheel"] },
    { path = "behavry_proxy/bundled/*.yml", format = ["sdist", "wheel"] },
    { path = "behavry_proxy/bundled/*.example", format = ["sdist", "wheel"] },
]

# Dependency groups are a Poetry feature; PEP 621 has no dev-dependency table.
[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.24"
ruff = ">=0.17.2"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
